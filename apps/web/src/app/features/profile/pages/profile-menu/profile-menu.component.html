<div class="min-h-screen bg-fundo pb-24">
  <header
    data-testid="profile-header"
    class="bg-primaria px-5 pb-8 pt-5 text-texto-inverso sm:px-8"
  >
    <div class="mx-auto flex max-w-3xl items-center justify-between">
      <img
        data-testid="profile-logo"
        src="/assets/logo.png"
        alt="PassAí"
        class="h-9 w-auto"
      />
      <button
        type="button"
        aria-label="Notificações"
        class="rounded-full p-2 text-texto-inverso focus:outline-none focus:ring-2 focus:ring-texto-inverso"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-6 w-6 fill-none stroke-current">
          <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
          />
        </svg>
      </button>
    </div>

    <div class="mx-auto mt-7 flex max-w-3xl items-center gap-4">
      @if (currentUser()?.avatar_url; as avatarUrl) {
        <img
          data-testid="profile-avatar"
          [src]="avatarUrl"
          [alt]="'Foto de perfil de ' + currentUser()?.name"
          class="h-16 w-16 rounded-full border-2 border-texto-inverso object-cover"
        />
      } @else {
        <span
          [attr.aria-label]="'Avatar de ' + (currentUser()?.name ?? 'usuário')"
          class="flex h-16 w-16 items-center justify-center rounded-full border-2 border-texto-inverso bg-superficie font-display text-xl font-bold text-primaria"
        >
          {{ avatarInitials() }}
        </span>
      }
      <div>
        <p class="font-caption text-caption text-texto-inverso/80">Meu perfil</p>
        <h1 class="font-display text-2xl font-bold text-texto-inverso">
          {{ currentUser()?.name }}
        </h1>
      </div>
    </div>
  </header>

  <main class="mx-auto -mt-2 max-w-3xl px-4 sm:px-6">
    <nav
      aria-label="Menu do perfil"
      class="overflow-hidden rounded-xl bg-superficie shadow-lg"
    >
      <ul class="divide-y divide-desabilitado">
        <li>
          <button type="button" class="flex w-full items-center gap-4 px-5 py-4 text-left">
            <span aria-hidden="true" class="text-primaria">◎</span>
            <span class="flex-1 font-body text-body text-texto">Editar Perfil</span>
            <span aria-hidden="true" class="text-texto-suave">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="flex w-full items-center gap-4 px-5 py-4 text-left">
            <span aria-hidden="true" class="text-primaria">⌑</span>
            <span class="flex-1 font-body text-body text-texto">Cadastrar Veículo</span>
            <span aria-hidden="true" class="text-texto-suave">›</span>
          </button>
        </li>
        <li>
          <a
            routerLink="/profile/saved-routes"
            data-testid="saved-routes-link"
            class="flex items-center gap-4 px-5 py-4 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primaria"
          >
            <span aria-hidden="true" class="text-primaria">⌖</span>
            <span class="flex-1 font-body text-body font-semibold text-texto">Rotas Salvas</span>
            <span aria-hidden="true" class="text-texto-suave">›</span>
          </a>
        </li>
        <li>
          <button type="button" class="flex w-full items-center gap-4 px-5 py-4 text-left">
            <span aria-hidden="true" class="text-primaria">▤</span>
            <span class="flex-1 font-body text-body text-texto">Termos de Uso</span>
            <span aria-hidden="true" class="text-texto-suave">›</span>
          </button>
        </li>
        <li>
          <button type="button" class="flex w-full items-center gap-4 px-5 py-4 text-left">
            <span aria-hidden="true" class="text-primaria">?</span>
            <span class="flex-1 font-body text-body text-texto">Ajuda</span>
            <span aria-hidden="true" class="text-texto-suave">›</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            (click)="logout()"
            class="flex w-full items-center gap-4 px-5 py-4 text-left"
          >
            <span aria-hidden="true" class="text-perigo">↪</span>
            <span class="flex-1 font-body text-body font-semibold text-perigo">Sair</span>
          </button>
        </li>
      </ul>
    </nav>
  </main>

  <nav
    aria-label="Navegação principal"
    class="fixed inset-x-0 bottom-0 border-t border-desabilitado bg-superficie px-4 py-3 shadow-sm"
  >
    <div class="mx-auto flex max-w-3xl justify-around">
      <a routerLink="/home" class="font-caption text-caption text-texto-suave">Início</a>
      <span class="font-caption text-caption text-primaria" aria-current="page">Perfil</span>
    </div>
  </nav>
</div>
