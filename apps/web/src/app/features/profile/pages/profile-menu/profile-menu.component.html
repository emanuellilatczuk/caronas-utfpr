<div class="min-h-screen bg-fundo pb-24">
  <!-- Header Hero no mesmo padrão visual da Home -->
  <header data-testid="profile-header" class="rounded-b-[2.5rem] bg-primaria pb-44 pt-5 text-texto-inverso">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 sm:px-8">
      <img
        data-testid="profile-logo"
        src="/assets/logo.png"
        alt="PassAí"
        width="187"
        height="47"
        class="block h-auto w-36 object-contain sm:w-40"
      />

      <button
        type="button"
        (click)="logout()"
        class="rounded-xl px-5 py-2.5 font-body text-base font-semibold text-texto-inverso transition-colors hover:bg-primaria-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-texto-inverso focus-visible:ring-offset-2 focus-visible:ring-offset-primaria sm:text-lg"
      >
        Sair
      </button>
    </div>

    <!-- Identificação do Usuário alinhada com o card central -->
    <div class="mx-auto mt-8 flex max-w-2xl items-center gap-4 px-4 sm:px-6">
      @if (currentUser()?.avatar_url; as avatarUrl) {
        <img
          data-testid="profile-avatar"
          [src]="avatarUrl"
          [alt]="'Foto de perfil de ' + currentUser()?.name"
          class="h-16 w-16 shrink-0 rounded-full border-2 border-texto-inverso object-cover shadow-sm"
        />
      } @else {
        <span
          [attr.aria-label]="'Avatar de ' + (currentUser()?.name ?? 'usuário')"
          class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full border-2 border-texto-inverso bg-superficie font-display text-xl font-bold text-primaria shadow-sm"
        >
          {{ avatarInitials() }}
        </span>
      }
      <div>
        <p class="font-caption text-[11px] font-medium text-texto-inverso/80">Meu perfil</p>
        <h1 class="font-display text-2xl font-bold tracking-tight text-texto-inverso sm:text-[26px]">
          {{ currentUser()?.name }}
        </h1>
      </div>
    </div>
  </header>

  <!-- Card Principal sobrepondo o Header -->
  <main class="mx-auto -mt-36 max-w-2xl px-4 sm:px-6">
    <nav
      aria-label="Menu do perfil"
      class="overflow-hidden rounded-3xl bg-superficie shadow-lg"
    >
      <ul class="divide-y divide-fundo">
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-4 px-5 py-4 text-left transition-colors hover:bg-fundo/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primaria sm:px-6"
          >
            <span
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-fundo text-primaria"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <span class="flex-1 font-body text-[13px] font-medium text-texto">Editar Perfil</span>
            <svg aria-hidden="true" class="h-4 w-4 text-texto-suave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </li>

        <li>
          <button
            type="button"
            class="flex w-full items-center gap-4 px-5 py-4 text-left transition-colors hover:bg-fundo/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primaria sm:px-6"
          >
            <span
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-fundo text-primaria"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
                <circle cx="7" cy="17" r="2" />
                <path d="M9 17h6" />
                <circle cx="17" cy="17" r="2" />
              </svg>
            </span>
            <span class="flex-1 font-body text-[13px] font-medium text-texto">Cadastrar Veículo</span>
            <svg aria-hidden="true" class="h-4 w-4 text-texto-suave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </li>

        <li>
          <a
            routerLink="/profile/saved-routes"
            data-testid="saved-routes-link"
            class="flex items-center gap-4 px-5 py-4 transition-colors hover:bg-fundo/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primaria sm:px-6"
          >
            <span
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-fundo text-primaria"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
              </svg>
            </span>
            <span class="flex-1 font-body text-[13px] font-semibold text-texto">Rotas Salvas</span>
            <svg aria-hidden="true" class="h-4 w-4 text-texto-suave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </a>
        </li>

        <li>
          <button
            type="button"
            class="flex w-full items-center gap-4 px-5 py-4 text-left transition-colors hover:bg-fundo/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primaria sm:px-6"
          >
            <span
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-fundo text-primaria"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
            </span>
            <span class="flex-1 font-body text-[13px] font-medium text-texto">Termos de Uso</span>
            <svg aria-hidden="true" class="h-4 w-4 text-texto-suave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </li>

        <li>
          <button
            type="button"
            class="flex w-full items-center gap-4 px-5 py-4 text-left transition-colors hover:bg-fundo/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primaria sm:px-6"
          >
            <span
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-fundo text-primaria"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              </svg>
            </span>
            <span class="flex-1 font-body text-[13px] font-medium text-texto">Ajuda</span>
            <svg aria-hidden="true" class="h-4 w-4 text-texto-suave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </li>

        <li>
          <button
            type="button"
            (click)="logout()"
            class="flex w-full items-center gap-4 px-5 py-4 text-left transition-colors hover:bg-fundo/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-perigo sm:px-6"
          >
            <span
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-fundo text-perigo"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </span>
            <span class="flex-1 font-body text-[13px] font-semibold text-perigo">Sair</span>
          </button>
        </li>
      </ul>
    </nav>
  </main>

  <!-- Navbar inferior (mantida para ajuste posterior) -->
  <app-bottom-navbar />
</div>
