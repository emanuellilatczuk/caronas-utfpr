<fieldset>
  <legend class="mb-2 font-label text-label font-semibold text-texto">Dias da semana</legend>
  <div class="flex flex-wrap gap-2">
    @for (day of weekdays; track day.value) {
      <button
        type="button"
        [attr.aria-pressed]="days().includes(day.value)"
        (click)="toggleDay(day.value)"
        class="rounded-full border border-primaria px-3 py-2 font-body text-body font-medium transition hover:bg-primaria/10 focus:outline-none focus:ring-2 focus:ring-primaria"
        [class.bg-primaria]="days().includes(day.value)"
        [class.text-primaria]="!days().includes(day.value)"
        [class.text-texto-inverso]="days().includes(day.value)"
      >
        {{ day.label }}
      </button>
    }
  </div>
</fieldset>
