<fieldset>
  <legend class="mb-2 block font-label text-[10px] font-bold uppercase tracking-wider text-texto-suave">
    Dias da semana
  </legend>
  <div class="flex flex-wrap gap-2">
    @for (day of weekdays; track day.value) {
      <button
        type="button"
        [attr.aria-pressed]="days().includes(day.value)"
        (click)="toggleDay(day.value)"
        class="rounded-full border border-primaria px-3.5 py-2 font-body text-[12px] font-semibold transition-colors hover:bg-primaria/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria"
        [class.bg-primaria]="days().includes(day.value)"
        [class.text-primaria]="!days().includes(day.value)"
        [class.text-texto-inverso]="days().includes(day.value)"
      >
        {{ day.label }}
      </button>
    }
  </div>
</fieldset>
