<div class="space-y-1.5">
  <p class="font-label text-[10px] font-bold uppercase tracking-wider text-texto-suave">CEP</p>
  <div class="flex items-stretch gap-2">
    <input
      type="text"
      inputmode="numeric"
      autocomplete="postal-code"
      maxlength="9"
      placeholder="00000-000"
      [value]="cep()"
      (input)="updateCep($event)"
      class="min-w-0 flex-1 rounded-xl bg-fundo px-3.5 py-3 font-body text-[13px] font-medium text-texto placeholder:text-desabilitado focus:outline-none focus:ring-2 focus:ring-primaria"
      aria-label="CEP"
    />
    <button
      type="button"
      (click)="search()"
      [attr.aria-busy]="loading()"
      class="shrink-0 rounded-xl bg-primaria px-4 py-3 font-button-primary text-[12px] font-semibold text-texto-inverso transition-colors hover:bg-primaria-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria focus-visible:ring-offset-2"
    >
      Buscar por CEP
    </button>
  </div>

  @if (loading()) {
    <p
      class="font-caption text-[11px] text-texto-suave"
      role="status"
      aria-live="polite"
    >
      Buscando CEP...
    </p>
  }

  @if (errorMessage(); as message) {
    <p class="font-caption text-[11px] text-perigo" role="alert">
      {{ message }}
    </p>
  }
</div>
