<nav
  aria-label="Navegação principal"
  class="fixed inset-x-0 bottom-0 z-40 border-t border-fundo bg-superficie px-4 py-2.5 shadow-sm"
>
  <div class="mx-auto grid max-w-2xl grid-cols-4 items-center">
    <!-- 1. Buscar -->
    <a
      routerLink="/home"
      routerLinkActive
      #buscarRla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [attr.aria-current]="buscarRla.isActive ? 'page' : null"
      [class]="
        buscarRla.isActive
          ? 'flex flex-col items-center justify-center gap-1 py-1 font-caption text-[11px] font-semibold text-primaria transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria'
          : 'flex flex-col items-center justify-center gap-1 py-1 font-caption text-[11px] font-medium text-texto-suave transition-colors hover:text-primaria focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria'
      "
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <span>Buscar</span>
    </a>

    <!-- 2. Oferecer (visual por enquanto) -->
    <button
      type="button"
      class="flex flex-col items-center justify-center gap-1 py-1 font-caption text-[11px] font-medium text-texto-suave transition-colors hover:text-primaria focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9" />
        <line x1="12" y1="8" x2="12" y2="16" />
        <line x1="8" y1="12" x2="16" y2="12" />
      </svg>
      <span>Oferecer</span>
    </button>

    <!-- 3. Caronas (visual por enquanto) -->
    <button
      type="button"
      class="flex flex-col items-center justify-center gap-1 py-1 font-caption text-[11px] font-medium text-texto-suave transition-colors hover:text-primaria focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
        <circle cx="7" cy="17" r="2" />
        <path d="M9 17h6" />
        <circle cx="17" cy="17" r="2" />
      </svg>
      <span>Caronas</span>
    </button>

    <!-- 4. Perfil -->
    <a
      routerLink="/profile"
      routerLinkActive
      #perfilRla="routerLinkActive"
      [attr.aria-current]="perfilRla.isActive ? 'page' : null"
      [class]="
        perfilRla.isActive
          ? 'flex flex-col items-center justify-center gap-1 py-1 font-caption text-[11px] font-semibold text-primaria transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria'
          : 'flex flex-col items-center justify-center gap-1 py-1 font-caption text-[11px] font-medium text-texto-suave transition-colors hover:text-primaria focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primaria'
      "
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span>Perfil</span>
    </a>
  </div>
</nav>
